  <rect x="306" y="269" width="27" height="27" rx="7"/>
  <rect x="144" y="314" width="27" height="27" rx="7"/>
  <rect x="198" y="314" width="27" height="27" rx="7"/>
  <rect x="252" y="314" width="27" height="27" rx="7"/>
  <rect x="306" y="314" width="27" height="27" rx="7"/>
</g>
<rect x="252" y="269" width="27" height="27" rx="7" fill="url(#slot)"/>

</svg>