<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B7CFF3"/>
    <stop offset="0.28" stop-color="#E9F1FE"/>
    <stop offset="0.55" stop-color="#DCE9FB"/>
    <stop offset="1" stop-color="#A9C3EC"/>
  </linearGradient>
  <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7E97BE"/>
    <stop offset="1" stop-color="#9DB2D4"/>
  </linearGradient>
  <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5B97F7"/>
    <stop offset="1" stop-color="#2F6BE0"/>
  </linearGradient>
  <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F2F7FF"/>
    <stop offset="1" stop-color="#C3D6F4"/>
  </linearGradient>
</defs>

<ellipse cx="252" cy="410" rx="128" ry="15" fill="#202124" opacity="0.10"/>

<!-- bin body -->
<path d="M134 148 L149 368 Q151 400 182 400 L322 400 Q353 400 355 368 L370 148 Z" fill="url(#body)"/>
<!-- inside (empty) -->
<ellipse cx="252" cy="148" rx="118" ry="34" fill="url(#inner)"/>
<ellipse cx="252" cy="158" rx="94" ry="23" fill="#677FA6" opacity="0.55"/>
<!-- rim light -->
<path d="M134 148 A118 34 0 0 1 370 148" fill="none" stroke="#DCE9FB" stroke-width="4" opacity="0.8"/>

<!-- slots -->
<rect x="196" y="222" width="14" height="112" rx="7" fill="url(#slot)"/>
<rect x="245" y="228" width="14" height="112" rx="7" fill="url(#slot)"/>
<rect x="294" y="222" width="14" height="112" rx="7" fill="url(#slot)"/>

<!-- soft right shade -->
<path d="M322 400 Q353 400 355 368 L370 148 L338 148 L326 400 Z" fill="#5B7DB4" opacity="0.13"/>

<!-- leaning lid -->
<g transform="translate(112 316) rotate(-18)">
  <ellipse cx="0" cy="9" rx="88" ry="31" fill="#9FB9E4"/>
  <ellipse cx="0" cy="0" rx="88" ry="31" fill="url(#lid)"/>
  <path d="M-32 4 Q0 -30 32 4" fill="none" stroke="#3E7CF0" stroke-width="12" stroke-linecap="round"/>
</g>
</svg>